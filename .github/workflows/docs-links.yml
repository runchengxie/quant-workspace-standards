name: Check documentation links

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'AGENTS.md'
      - 'AGENTS.zh-CN.md'
      - 'site/AGENTS.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/check-doc-links.test.mjs'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'AGENTS.md'
      - 'AGENTS.zh-CN.md'
      - 'site/AGENTS.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/check-doc-links.test.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test link checker
        run: node scripts/check-doc-links.test.mjs
      - name: Check links in docs
        run: node scripts/check-doc-links.mjs
