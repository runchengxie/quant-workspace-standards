name: Check documentation links

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'AGENTS.md'
      - 'AGENTS.zh-CN.md'
      - 'site/AGENTS.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/check-doc-links.test.mjs'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'AGENTS.md'
      - 'AGENTS.zh-CN.md'
      - 'site/AGENTS.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/check-doc-links.test.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test link checker
        run: node scripts/check-doc-links.test.mjs
      - name: Check links in docs
        run: node scripts/check-doc-links.mjs
