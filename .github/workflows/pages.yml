name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - AGENTS.zh-CN.md
      - 'site/**'
      - 'docs/content/**'
      - 'scripts/repo-maintenance/**'
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - AGENTS.md
      - AGENTS.zh-CN.md
      - 'site/**'
      - 'docs/content/**'
      - 'scripts/repo-maintenance/**'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure temporary output
        run: |
          printf 'STANDARDS_SITE_OUTPUT_DIR=%s/standards-site\nSTANDARDS_BROWSER_OUTPUT_DIR=%s/standards-browser-results\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: bun run check
      - name: Test preferences and output boundaries
        run: bun run test:unit
      - name: Build site and downloads
        run: bun run build --output-dir "$STANDARDS_SITE_OUTPUT_DIR"
      - name: Validate portable pages and resources
        run: bun run test:artifacts
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Validate themes, localization and offline presentation
        run: bun run test:browser
      - name: Audit locked dependencies
        run: bun audit
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/standards-site

  minimum-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure temporary output
        run: |
          printf 'STANDARDS_SITE_OUTPUT_DIR=%s/standards-site-minimum\nSTANDARDS_BROWSER_OUTPUT_DIR=%s/standards-browser-minimum\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up minimum supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: bun run check
      - name: Test preferences and output boundaries
        run: bun run test:unit
      - name: Build site and downloads
        run: bun run build --output-dir "$STANDARDS_SITE_OUTPUT_DIR"
      - name: Validate portable pages and resources
        run: bun run test:artifacts
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Validate minimum-Node themes, localization and offline presentation
        run: bun run test:browser
      - name: Audit locked dependencies
        run: bun audit

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, minimum-node]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
