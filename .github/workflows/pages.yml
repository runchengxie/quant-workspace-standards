name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - requirements-pages.txt
      - scripts/build_pages.py
      - "site/**"
      - "content/**"
      - "skills/**"
      - "tests/**"
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - AGENTS.md
      - requirements-pages.txt
      - scripts/build_pages.py
      - "site/**"
      - "content/**"
      - "skills/**"
      - "tests/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install page builder
        run: python -m pip install -r requirements-pages.txt
      - name: Validate portable pages and resources
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python scripts/build_pages.py --output-dir _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
