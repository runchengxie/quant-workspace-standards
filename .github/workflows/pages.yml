name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - AGENTS.zh-CN.md
      - 'site/**'
      - 'content/**'
      - 'skills/**'
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - AGENTS.md
      - AGENTS.zh-CN.md
      - 'site/**'
      - 'content/**'
      - 'skills/**'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure temporary output
        run: |
          printf 'STANDARDS_SITE_OUTPUT_DIR=%s/standards-site\nSTANDARDS_BROWSER_OUTPUT_DIR=%s/standards-browser-results\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: bun run check
      - name: Test preferences and output boundaries
        run: bun run test:unit
      - name: Build site and downloads
        run: bun run build --output-dir "$STANDARDS_SITE_OUTPUT_DIR"
      - name: Validate portable pages and resources
        run: bun run test:artifacts
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Validate themes, localization and offline presentation
        run: bun run test:browser
      - name: Audit locked dependencies
        run: bun audit
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/standards-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
